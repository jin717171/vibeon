/* v6 — focused welcome, separate personal sign-in, then team selection */
.hero-v6{min-height:452px;grid-template-columns:1.05fr .95fr}
.hero-v6 .hero-copy{position:relative;z-index:1}
.hero-kicker{font-size:13px;font-weight:900;letter-spacing:.05em;color:#93ece6;margin-bottom:21px}
.hero-v6 h1{font-size:clamp(36px,5vw,64px);margin-bottom:18px}
.hero-v6 p{font-size:16px;max-width:485px;margin-bottom:27px}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px}
.hero-cta .btn{min-width:158px;padding:14px 22px;min-height:52px;justify-content:space-between;font-size:15px}
.hero-cta .hero-primary{background:#fff;color:#3c35aa}
.hero-cta .hero-outline{color:white;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.55)}
.hero-cta .hero-outline:hover{background:rgba(255,255,255,.19)}
.mock-heading{font-size:19px;margin:15px 0 13px}
.mock-complete{color:#168b76;font-weight:900}
.mock-progress{height:8px;background:#eeeaff;border-radius:8px;margin-top:15px}
.mock-progress i{display:block;width:77%;height:100%;border-radius:8px;background:#6c5ae9}
.infographic-section{margin:49px 0 15px}
.infographic-title{text-align:center;margin:0 auto 25px;max-width:720px}
.infographic-title h2{font-size:clamp(26px,3vw,33px);margin-bottom:9px}
.infographic-title p{font-size:15px;color:var(--muted)}
.hack-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.hack-step{position:relative;border:1px solid #e7e6f5;background:#fff;border-radius:22px;padding:24px 18px 25px;text-align:center;box-shadow:var(--shadow);min-width:0}
.hack-step:not(:last-child):after{content:'›';position:absolute;z-index:2;right:-18px;top:39%;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #dedcf7;font-size:30px;line-height:1;color:#7669dc;box-shadow:0 3px 10px rgba(56,41,156,.12)}
.hack-symbol{width:83px;height:83px;border-radius:24px;display:grid;place-items:center;margin:0 auto 18px;font-size:39px}
.symbol-one{background:#fff2d9}.symbol-two{background:#eae5ff}.symbol-three{background:#e1f4ff}.symbol-four{background:#d9f8ef}
.hack-count{font-size:12px;font-weight:900;letter-spacing:.14em;color:#6756d5;margin-bottom:8px}
.hack-step h3{font-size:19px;margin-bottom:9px}
.hack-step p{color:#63708b;font-size:13px;line-height:1.65}
.hack-bottom{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:23px;color:#5a5ca7;font-size:13px;font-weight:850}
.hack-bottom .hack-arrow{color:#a3a2bf}
.auth-page{max-width:830px;margin:44px auto 0}
.auth-heading{text-align:center;margin:0 auto 25px}

</style></head><body><div id="app"></div><div id="toast" class="toast" hidden role="status" aria-live="polite"></div><script>const SEED={"1": {"members": "김심은, 박지민, 유지우", "plan": "1. 해결하고 싶은 문제\n1)문제 상황: 인공지능을 통해 인간의 목소리를 구현할 수 있게 되자 이를 보이스 피싱과 같이 범죄에 악용하는 사례가 생김\n2)누가 겪는 문제인가? 모두가 범죄에 노출되어있지만 노년층과 같이 디지털에 친숙하지 못하고 구별하기 어려운 디지털 취약 계층에게는 문제가 더 크게 다가올 것이다.\n3) 왜 해결이 필요한가? 기술이 범죄에 악용되어 범죄 피해자를 만들어내고 긍정적으로 이용될 수 있는 기회를 단절시킨다.\n4) 한줄로 문제쓰기: 소리를 만들어내는 인공지능을 악용해 범죄에 이용하는 것은 불특정 다수와 사회에 악을 끼치므로 해결해야한다.\n\n2. 해결 아이디어\n1) 해결 아이디어: 소리의 주체가 인간인지 인공지능인지를 판별해주는 프로그램을 제작한다.\n2) 어떻게 해결할까? 소리가 인식되면 이를 스펙트럼으로 변환해 두 주체의 스펙트럼 사이의 미세한 차이를 구분할 수 있는 인공지능을 활용하여 프로그램을 제작한다.\n3) 필요한 기능 또는 방법: 인식된 소리를 스펙트럼으로 변환해주는 기능, 인간과 인공지능이 만든 소리의 스펙트럼을 학습시켜 이를 구별할 수 있는 기능\n4) 예상 결과물: 소리를 인식시키면 프로그램이 인식된 소리가 인간의 소리인지 인공지능으로 만들어진 소리인지 사용자에게 알린다.\n5) 기대효과: 프로그램에 녹음된 파일을 업로드하거나 기기에서 상시 작동하는 방식을 통해 인공지능을 구별하지 못해 발생하는 피해를 예방한다.", "feedback": "[좋은 점] AI 음성 악용 문제와 디지털 취약계층이라는 대상이 분명합니다. 소리 파일을 입력하고 분석 결과를 보여 주는 사용자 흐름도 구체적입니다.\n[구현 한계] 음성 스펙트럼만으로 실제 음성과 AI 생성 음성을 신뢰도 높게 판별하려면 검증된 학습자료·모델과 성능 검사가 필요합니다. 간단한 특징 차이로 ‘진짜/가짜’를 확정하거나 범죄 예방 효과를 보장할 수 없습니다. 전화 통화를 항상 감시하는 기능은 권한과 개인정보 문제도 있습니다.\n[이번 해커톤 권장 범위] ① 음성 파일 업로드 ② 브라우저에서 파형·스펙트럼 시각화 ③ ‘실험적 분석 결과/판별 불가’ 안내 ④ 보이스피싱 예방 행동 안내를 구현해 보세요. 실제 판별 모델이 없다면 결과를 임의로 ‘AI 음성’이라 표시하지 말고 ‘판별 기능은 시연용’이라고 분명히 적으세요.\n[팀에 묻기] 실제로 검증된 음성 분류 모델과 평가 자료가 있나요? 없다면 음성 분석 도구 + 예방 가이드로 목표를 조정할까요?"}, "2": {"members": "김민준, 허성혁", "plan": "1. 해결하고 싶은 문제\n1)문제 상황: 에어컨이나 히터를 틀었을때 교실 전체가 시원해지거나 따뜻해지지 않기 때문에 문제다\n2)누가 겪는 문제인가? 모든 학생들\n3) 왜 해결이 필요한가? 상대적으로 냉난방이 덜되는 자리에 있는 학생들이 계속 덥거나 춥다고해서 전기세가 더 나가야한다\n4) 한줄로 문제쓰기: 전기세 낭비 줄이기\n\n2. 해결 아이디어\n1) 해결 아이디어: 에어컨 펜 받침대\n2) 어떻게 해결할까? 에어컨 펜 받침대를 모든 방향으로 갈 수 있게 한다.\n3) 필요한 기능 또는 방법: 선풍기 회전 기능과 같은 기능을 넣는다.\n4) 예상 결과물: 움직이는 펜\n5) 기대효과: 전기세 절감", "feedback": "[좋은 점] 교실 냉난방의 불균형과 불필요한 에너지 사용이라는 학교생활 문제를 발견했습니다.\n[보완할 점] '에어컨 펜 받침대', '움직이는 펜'이 어떤 부품을 뜻하는지 불명확합니다. 회전형 송풍 방향 조절 장치를 말하는지 모형을 먼저 합의해 주세요. 전기요금 절감은 실제 측정 없이는 확인할 수 없습니다.\n[구현 한계] 모터가 움직이는 물리 장치는 웹앱만으로 공부법 검색\n4) 예상 결과물: 공부법 등록, 메타인지 태깅 효능 리뷰 작성 및 맞춤 추천 기능이 구현된 웹\n5) 기대효과: 나에게 맞는 공부법 발견, 공부법 정보의 신뢰성 극대화, 동료 학습 활성화", "feedback": "[좋은 점] 대상 사용자의 어려움과 후기·학습 성향 태그·필터라는 핵심 기능이 명확합니다. 학생 간 경험 공유와 메타인지 연결도 좋습니다.\n[주의할 점] 다른 학생을 공격하는 후기·신상 공개·중복 계정·허위 리뷰를 방지할 필요가 있습니다. ‘실제로 검증된 공부법’이라는 단정은 단순 좋아요·후기만으로 보장할 수 없습니다. 실명 확인을 앱만으로 자동 수행하기는 어렵습니다.\n[이번 해커톤 권장 범위] ① 공부법 게시글(제목·방법·성향 태그) ② 태그 검색 ③ 체험 후기와 자기평가 ④ 신고 버튼·운영자 삭제 기능을 만드세요. 게시글은 익명 표시 가능하지만 관리자에게 작성자 기록이 남는 구조를 기획하세요. 계정 유일성은 학교가 승인한 인증 방식으로 구현해야 합니다.\n[팀에 묻기] 누가 게시글을 지울 수 있나요? 비방 댓글과 중복 후기를 어떻게 처리하나요? 개인정보를 최소화할 수 있나요?"}, "8": {"members": "김량현, 이지안, 장동하", "plan": "1. 해결하고 싶은 문제\n1)문제 상황: 최근 친환경 제품에 대한 관심이 높아지면서 제품을 친환경적으로 보이게 홍보하는 사례가 문제됨(그린워싱 문제)\n2)누가 겪는 문제인가? 친환경 제품을 구매하는 소비자, 친환경 소재를 개발하는 연구자, 제품을 생산하고 판매하는 기업 등이 문제를 겪을 수 있음\n3) 왜 해결이 필요한가? 그린워싱은 소비자가 정확한 정보에 근거해 제품을 선택하는 것을 어렵게하고 실제 환경적 효과가 충분히 확인되지 않은 제품의 구매로 이어질 수 있다. 따라서 제품의 광고문구와 과학적 근거를 비교할 수 있는 도구를 마련해 소비자가 판단하도록 도울 필요가 있다.\n4) 한줄로 문제쓰기: 친환경 제품 광고의 주장과 과학적 근거를 쉽게 비교하기 어려워 발생하는 소비자의 정보 부족 문제를 해결해야 한다.\n\n2. 해결 아이디어\n1) 해결 아이디어: 제품의 친환경 광고 문구와 소재 정보, 분해 조건, 환경 인증 및 관련 근거 자료를 분석하는 화학 데이터 기반 그린워싱 팩트체크 프로그램을 개발한다\n2) 어떻게 해결할까? 친환경 제품의 광고 문구, 소재, 분해조건, 환경인증 등 다양한 관련 정보를 수집한다. 공공기관과 공신력있는 자료에서 확인한 정보를 출처와 데이터베이스에 저장한다. 사용자가 제품의 광고 문구과 소재 정보를 입력할 수 있는 화면을 만든다. 조건문과 비교 알고리즘을 활용해 입력된 주장에 관한 근거가 있는지 확인하고 필요 항목을 분류한다. 분석 결과와 근거 자료의 출처를 화면에 표시해 사용자가 직접 확인할 수 있게 한다.\n3) 필요한 기능 또는 방법: 용자가 제품의 광고 문구과 소재 정보를 입력할 수 있는 화면, 공공기관과 공신력있는 자료에서 확인한 정보를 출처를 비교하는 기능, 주장에 관한 근거가 있는지 확인하고 필요 항목을 분류, 자료의 출처를 화면에 표시해 사용자가 직접 확인하는 기능\n4) 예상 결과물: 사용자가 친환경 제품의 광고 문구와 소재 정보를 입력하면 관련 근거 자료와 비교 결과를 보여주는 프로그램을 제작한다.\n5) 기대효과: 소비자가 친환경 광고를 비판적으로 검토하고 과학적 근거를 바탕으로 합리적인 구매 결정을 내리는데 도움을 줄 수 있다. 또한 환경적 효과를 검토하며 화학적 능력을 기르고 소비자의 구매 선택과 기업의 신뢰를 경제적으로 이해할 수 있다.", "feedback": "[좋은 점] 친환경 광고 주장과 객관적 근거를 비교한다는 목표가 뚜렷하고, 정보의 출처를 직접 보여 주려는 설계가 좋습니다.\n[구현 한계] 모든 제품 광고의 진실을 자동 판정하려면 검증된 최신 근거 자료와 분석 체계가 필요합니다. ‘그린워싱 확정’과 같은 판정은 근거 부족 시 피해야 합니다. 외부 기관 사이트의 데이터를 무단 수집하면 이용 조건 문제가 생길 수 있습니다.\n[이번 해커톤 권장 범위] ① 제품 function loginPage(){layout(`<section class="auth-page"><div class="auth-heading"><div class="auth-icon">🔐</div><h1>개인 로그인</h1><p>자신의 이름을 선택하고 개인 PIN으로 로그인하세요.</p></div><div class="card pad login-card"><div class="login-tabs"><button data-act="set-login" data-mode="register" class="${loginMode==='register'?'active':''}">처음 참여</button><button data-act="set-login" data-mode="login" class="${loginMode==='login'?'active':''}">다시 로그인</button></div>${loginMode==='register'?`<form id="join-form"><div class="field"><label for="reg-student">내 이름</label><select class="select" name="student" id="reg-student" required><option value="">이름 선택</option>${allMemberOptions()}</select></div><div class="grid2"><div class="field"><label>개인 PIN 설정 (숫자 6자리)</label><input class="input" type="password" name="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" placeholder="6자리 PIN"></div><div class="field"><label>개인 PIN 확인</label><input class="input" type="password" name="pin2" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" placeholder="다시 입력"></div></div><div class="field" id="teacher-code-field" hidden><label>교사 인증 코드</label><input class="input" type="password" name="teacherCode" inputmode="numeric" maxlength="4" placeholder="교사 콘솔 코드" autocomplete="off"></div><p class="pin-guide">개인 PIN은 소감문 작성에도 사용해요.</p><button type="submit" class="btn block">개인 등록하기 →</button></form>`:`<form id="login-form"><div class="field"><label>내 이름</label><select class="select" name="student" required><option value="">이름 선택</option>${allMemberOptions()}</select></div><div class="field"><label>개인 PIN</label><input class="input" type="password" name="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" placeholder="개인 PIN 6자리"></div><button class="btn block" type="submit">개인 로그인 →</button></form>`}</div><button class="teacher-link" data-act="goto-teacher">교사 콘솔</button></section>`)}
function gate(){if(!member){view='login';return render()}let options=Array.from({length:10},(_,i)=>{let n=i+1;return `<button type="button" class="team-choice ${teamChoice===n?'selected':''} ${n===10?'teacher-choice':''}" data-act="select-team" data-no="${n}" aria-pressed="${teamChoice===n}"><span class="team-choice-number">${String(n).padStart(2,'0')}</span><span>${n===10?'교사 예시 · 10모둠':n+'모둠'}</span><span class="choice-arrow">→</span></button>`}).join('');let hasPin=!!db.teamPins[member.team];layout(`<div class="team-gate"><div class="auth-heading"><div class="auth-icon">👥</div><h1>모둠 입장</h1><p>${esc(member.name)}님, 자신의 모둠을 선택하세요.</p></div><div class="team-choice-grid">${options}</div>${teamChoice?`<div class="card pad team-pin-card"><h2>${teamChoice}모둠 · ${hasPin?'PIN 입력':'첫 모둠 PIN 설정'}</h2><p class="muted">${hasPin?'팀원들과 정한 모둠 PIN을 입력하세요.':'모둠에서 사용할 숫자 6자리 PIN을 정하고 팀원들과 공유하세요.'}</p><form id="team-form"><input type="hidden" name="team" value="${teamChoice}"><div class="field"><label>${hasPin?'모둠 PIN':'새 모둠 PIN (6자리)'}</label><input type="password" name="pin" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" class="input" autocomplete="off" placeholder="숫자 6자리" required autofocus></div>${hasPin?'':`<div class="field"><label>모둠 PIN 확인</label><input type="password" name="pin2" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" class="input" autocomplete="off" placeholder="한 번 더 입력" required></div>`}<button class="btn block" type="submit">${hasPin?'모둠 활동 시작':'모둠 PIN 설정하고 입장'} →</button></form></div>`:''}</div>`)}
function nav(){return `<nav class="nav" aria-label="해커톤 활동 메뉴">${[['plan','📄','계획서'],['notes','💬','생각 모으기'],['spec','🧩','웹앱 기획'],['prompt','✨','프롬프트'],['guide','🔗','제작·배포'],['submit','🚀','작품 제출'],['gallery','🏆','작품 공유회'],['reflect','📝','소감·평가']].map(x=>`<button data-act="tab" data-tab="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]} ${x[2]}</button>`).join('')}</nav>`}
function workspace(){if(!member)return render();if(!teamEntered){view='gate';return render()}let t=SEED[member.team],d=db.teamData[member.team];let body={'plan':renderPlan,'notes':renderNotes,'spec':renderSpec,'prompt':renderPrompt,'guide':renderGuide,'submit':renderSubmit,'gallery':renderGallery,'reflect':renderReflect}[tab]();layout(`<div class="page-header"><div><div class="eyebrow">TEAM ${String(member.team).padStart(2,'0')} · WORKSPACE</div><h1>${member.team}모둠 웹앱 제작실</h1><p>${esc(t.members)}</p></div></div>${nav()}${body}`)}
function planSections(plan){const marks=['1. 해결하고 싶은 문제','2. 해결 아이디어'];let starts=marks.map(m=>plan.indexOf(m));let out=[];for(let i=0;i<2;i++){let part=plan.slice(starts[i]+marks[i].length,i===0?starts[1]:undefined).trim();let lines=part.split(/\n(?=\s*[1-5]\)\s*)/).map(s=>s.trim()).filter(Boolean);out.push({title:marks[i],lines})}return out}
function pointText(str){let m=str.match(/^([1-5])\)\s*(.*)$/s);if(!m)return {n:'•',str};return {n:m[1],str:m[2]}}
function planCard(n,compact=false){let data=SEED[n],parts=planSections(data.plan);return `<div class="card big-plan"><div class="plan-header"><div class="eyebrow light">ORIGINAL PROJECT PLAN</div><h2 style="font-size:25px">${n}모둠 문제 해결 계획서</h2><p>작성 학생: ${esc(data.members)}</p></div><div class="plan-body">${parts.map((g,i)=>`<section class="plan-block"><h3><span class="section-num">${i+1}</span>${esc(g.title.replace(/^\d\. /,''))}</h3><div class="plan-points">${g.lines.map(s=>{let p=pointText(s);return `<div class="plan-point"><span class="point-num">${p.n}</span><p>${esc(p.str)}</p></div>`}).join('')}</div></section>`).join('')}</div></div>`}
function feedbackCard(n){let data=SEED[n];let items=data.feedback.split(/\n(?=\[)/).map(s=>{let m=s.match(/^\[([^\]]+)\]\s*([\s\S]*)/);return m?{label:m[1],body:m[2]}:{label:'안내',body:s}});return `<div class="feedback-card"><div class="eyebrow">TEACHER'S FEEDBACK</div><h2 class="step-title">${n}모둠 사전 맞춤형 피드백</h2>${items.map(x=>`<div class="feedback-item"><strong>${esc(x.label)}</strong><p>${esc(x.body)}</p></div>`).join('')}</div>`}
function renderPlan(){return `<div class="headline"><h2>01 · 계획서와 사전 피드백</h2></div><div class="notice mint" style="margin-bottom:18px">먼저 계획서를 함께 읽고, 교사 피드백을 참고해 실제 구현 범위를 정하세요. 이미 적은 문제 정의는 다시 작성하지 않아요.</div><div class="plan-layout"><div>${planCard(member.team)}</div><div>${feedbackCard(member.team)}</div></div><div class="float-footer"><span class="note">다음 단계 · 팀원마다 보완할 생각을 기록하고 합의해요.</span><button class="btn" data-act="tab" data-tab="notes">생각 모으기 →</button></div>`}
function renderNotes(){let arr=db.teamData[member.team].notes;return `<div class="section-head"><div class="eyebrow">STEP 02 · TEAM DISCUSSION</div><h2>함께 생각을 보충해요</h2><p class="muted">계획서에 이미 적은 내용을 다시 쓰지 않고, 구현할 수 있는 방법·우선순위·주의할 점을 논의해요.</p></div><div class="split"><div class="card pad"><h3 style="font-size:20px;margin-bottom:20px">내 의견 남기기</h3><form id="note-form"><div class="field"><label>의견 종류</label><select class="select" name="kind"><option>구현하면 좋은 기능</option><option>교사 피드백을 반영한 대안</option><option>디자인·모바일 아이디어</option><option>구현이 어려운 부분·질문</option><option>팀의 최종 합의</option></select></div><div class="field"><label>내 생각은 무엇인가요?</label><textarea class="textarea" name="text" required maxlength="1500" placeholder="예: 자동 분류 장치는 어렵기 때문에 먼저 입력된 데이터를 자동 집계하는 웹앱을 만들자."></textarea></div><button class="btn block" type="submit">${esc(member.name)} 이름으로 의견 공유하기</button></form><div class="divider"></div><h3 style="font-size:17px;margin-bottom:13px">모둠별 합의 확인</h3><div class="notice">1. 오늘 만들 필수 기능을 3개 이내로 줄였나요?<br>2. 팀원별로 맡을 역할을 정했나요?<br>3. 불가능한 기능은 현실적인 대안으로 바꾸었나요?</div></div><div><div class="heading-line"><h2>모둠 의견 모음</h2><span class="tag violet">${arr.length}개</span></div>${arr.length?`<div class="entry-list">${arr.slice().reverse().map(x=>`<article class="entry"><div class="meta"><b>${esc(x.author)}</b><span>${esc(x.date)}</span></div><span class="tag violet" style="margin-bottom:11px">${esc(x.kind)}</span><p>${esc(x.text)}</p>${x.id===member.id?`<div style="text-align:right;margin-top:11px"><button class="btn small danger" data-act="remove-note" data-id="${esc(x.uid)}">삭제</button></div>`:''}</article>`).join('')}</div>`:`<div class="empty">💬<b>아직 작성된 의견이 없어요.</b>모둠원 각자 한 가지씩 제안하면서 시작해 봐요.</div>`}</div></div><div class="float-footer"><span class="note">친구들의 제안을 읽고 실제 기능·화면 설계로 옮겨 보세요.</span><button class="btn" data-act="tab" data-tab="spec">웹앱 기획하기 →</button></div>`}
function renderSpec(){let spec=db.teamData[member.team].spec;let all=QGROUPS.flatMap(g=>g.questions),required=all.filter(q=>q[4]),done=required.filter(q=>nice(spec[q[0]])).length;return `<div class="page-header"><div><div class="eyebrow">STEP 03 · DESIGN BRIEF</div><h1>웹앱 상세 기획</h1><p>중복되는 문제 정의 대신 화면·기능·모바일 작동 조건을 명확히 정해요.</p></div><span class="tag violet">필수 ${done}/${required.length}</span></div><div class="card pad" style="margin-bottom:19px"><div class="row spread" style="margin-bottom:13px"><b>완성 프롬프트 준비도</b><span id="spec-count" class="tag violet">${done}/${required.length}개</span></div><div class="progressline"><i id="spec-progress" style="width:${Math.round(100*done/required.length)}%"></i></div><p class="note" style="margin-top:11px">작성 즉시 이 브라우저에 저장돼요. 팀원들이 함께 의견을 합쳐 하나의 기획서로 완성해요.</p></div>${QGROUPS.map((g,gi)=>`<section class="card question-card"><div class="question-head"><span class="qnum">0${gi+1}</span><div><h3>${g.icon} ${esc(g.title)}</h3><p class="note">${esc(g.intro)}</p></div></div>${g.questions.map(q=>`<div class="question-block"><label for="q-${q[0]}">${esc(q[1])}${q[4]?'<span style="color:#ba496b"> *</span>':''}</label><textarea class="textarea" id="q-${q[0]}" data-spec="${q[0]}" placeholder="${esc(q[2])}">${esc(spec[q[0]]||'')}</textarea><p class="helper">${esc(q[3])}</p></div>`).join('')}</section>`).join('')}<div class="card pad"><div class="heading-line"><h2>디자인 참고 이미지</h2><span class="tag">최대 3장 · 이미지당 1MB 이하로 압축</span></div><p class="note" style="margin-bottom:15px">원하는 색·배치·카드 스타일을 참고할 수 있어요. 실제 제작할 때는 같은 이미지를 ChatGPT에도 첨부해 주세요.</p><input id="ref-file" type="file" accept="image/*" class="input" multiple aria-label="참고 이미지 업로드" style="padding:10px"><div class="ref-list" style="margin-top:16px">${(db.teamData[member.team].refs||[]).map((x,i)=>`<div class="ref-item"><img src="${x.data}" alt="참고 이미지 ${i+1}"><button data-act="ref-remove" data-index="${i}" aria-label="참고 이미지 삭제">×</button><span class="filename">${esc(x.name)}</span></div>`).join('')}</div></div><div class="float-footer"><span class="note">* 표시된 필수 질문을 모두 채우면 제작 프롬프트를 생성할 수 있어요.</span><button class="btn" data-act="tab" data-tab="prompt">프롬프트 확인하기 →</button></div>`}
function allRequired(){return QGROUPS.flatMap(g=>g.questions).filter(q=>q[4])}
function buildPrompt(n){let t=SEED[n],s=db.teamData[n].spec;let sections=QGROUPS.map(g=>`## ${g.title}\n`+g.questions.map(q=>`- ${q[1]}\n${nice(s[q[0]])||'(미정: 합리적인 기본값 사용)'}`).join('\n\n')).join('\n\n');let notes=db.teamData[n].notes.map(v=>`- (${v.kind}): ${v.text}`).join('\n')||'(추가 의견 없음)';return `당신은 시니어 모바일 웹 프론트엔드 개발자이자 사용성 설계 전문가입니다. 다음 원문 계획서와 학생 합의 내용을 정확히 반영하여, 학교 해커톤에서 시연할 수 있는 완성도 높은 반응형 웹앱을 만들어 주세요. 질문을 다시 반복하지 말고, 빠진 세부사항은 아래 설계와 일관되는 합리적인 기본값을 선택해 실제로 작동하는 결과물을 먼저 제시하세요.\n\n[프로젝트 / 작성자]\n제1회 호연고 해커톤 · ${n}모둠\n모둠원 이름은 제작 결과에 필요하지 않으므로 생략합니다.\n\n[1. 학생이 미리 제출한 문제 해결 계획서 — 원문이며 임의로 바꾸지 마세요]\n${t.plan}\n\n[2. 사전 교사 피드백 — 실현 가능 범위와 주의사항]\n${t.feedback}\n\n[3. 팀원들이 추가로 제안한 의견]\n${notes}\n\n[4. 모둠이 합의한 구체적 웹앱 명세]\n${sections}\n\n[5. 구현 필수 기준]\n1. HTML/CSS/바닐라 JavaScript로 완성하고, 특별한 도구 설치 없이 index.html만으로 미리 볼 수 있는 첫 버전을 우선 제작하세요. 외부 API나 서버가 필수라면 실제 작동과 시연 모드를 명확히 구분하고 대체 동작을 완성해 주세요.\n2. MOBILE FIRST: 360px/390px(휴대폰)에서 가로 스크롤과 요소 잘림 없이 보이게 해 주세요. 버튼의 터치 영역은 가급적 44x44px 이상, 본문은 읽기 쉬운 크기, 카드 1열, 명확한 화면 이동을 우선하세요. 768px 태블릿과 1280px PC에도 반응형으로 배치하세요.\n3. 각 화면은 모둠이 명세한 내용과 동선 그대로 만드세요. 모든 버튼·탭·입력·검색·추가·삭제·결과 기능이 실제 작동하도록 구현하세요. 장식뿐인 버튼, 빈 더미 링크, 미완성 TODO 코드를 남기지 마세요.\n4. 데이터가 필요한 기능은 실제 예시 데이터와 입력 검증, 빈 결과, 오류 안내, 초기화/다시 하기까지 갖추세요. 서버 미연결 시 같은 기기에서 시험하도록 localStorage를 사용하되, 여러 기기 공유처럼 허위로 표현하지 마세요.\n5. 가공 데이터·AI 자동 판정·실제 정확도·물리 장치 제어 등 검증하지 않은 기능은 진짜처럼 표현하지 마세요. 필요하면 교육용 시뮬레이션·사용자 입력 방식으로 구현하고 한계를 UI에 명시하세요.\n6. 디자인은 한눈에 읽히는 굵은 제목, 일관된 색, 정돈된 카드, 충분한 여백, 명확한 CTA 중심으로 구현하세요. 접근 가능한 대비와 키보드 입력도 고려하세요.\n7. 먼저 완성된 모든 파일의 코드를 제공하고(가능하면 index.html 단일 파일), 이어서 실행 방법, 어떤 기능이 실제 동작하는지, 향후 Supabase 연결이 필요한 부분, 360/390/768/1280px 테스트 체크리스트를 정리하세요.\n8. 인터넷 연결이 없으면 작동하지 않는 외부 패키지 의존성을 되도록 피하세요. 보안키/개인정보를 코드에 포함하지 마세요.\n9. 프로젝트 원래 의도와 사전 피드백이 충돌할 때는 피드백의 구현 가능 범위를 우선하되, 왜 조정했는지 결과물에서 분명하게 알려 주세요.\n\n중요: 개요 설명만 하지 말고, 복사해서 실행할 수 있는 완성 코드와 실제 동작하는 예시를 작성하세요.`}
function renderPrompt(){let required=allRequired(),spec=db.teamData[member.team].spec,missing=required.filter(q=>!nice(spec[q[0]]));return `<div class="page-header"><div><div class="eyebrow">STEP 04 · AI PROMPT</div><h1>GPT 제작 프롬프트</h1><p>계획서 + 교사 피드백 + 모둠원 의견 + 상세 기획이 자동으로 합쳐져요.</p></div><span class="tag ${missing.length?'amber':'mint'}">${missing.length?'필수 '+missing.length+'문항 남음':'제작 준비 완료'}</span></div>${missing.length?`<div class="notice amber" style="margin-bottom:17px"><b>프롬프트를 복사하려면 아래 필수 질문을 채워 주세요.</b><div style="margin-top:8px">${missing.map(x=>`• ${esc(x[1])}`).join('<br>')}</div><button class="btn small outline" style="margin-top:13px" data-act="tab" data-tab="spec">기획 돌아가기</button></div>`:`<div class="notice mint" style="margin-bottom:17px">기획 질문을 모두 채웠어요. 아래 프롬프트를 ChatGPT에 그대로 붙여넣고 필요한 참고 이미지를 함께 첨부하세요. 첫 결과를 직접 테스트하는 과정은 여전히 필요해요.</div>`}<div class="card pad"><div class="headline"><h2>완성 프롬프트 미리보기</h2><span class="tag violet">${(buildPrompt(member.team).length).toLocaleString()}자</span></div><div class="prompt-preview" id="prompt-preview">${esc(buildPrompt(member.team))}</div><div class="float-footer"><span class="note">AI의 첫 결과를 반드시 실제로 눌러 보고 확인하세요.</span><div class="row wrap"><button class="btn outline" data-act="download-prompt">TXT 저장</button><button class="btn" ${missing.length?'disabled':''} data-act="copy-prompt">전체 프롬프트 복사</button></div></div></div>`}
function renderGuide(){return `<div class="section-head"><div class="eyebrow">STEP 05 · BUILD & DEPLOY</div><h2>제작과 배포 따라하기</h2><p class="muted">단계별 안내를 보면서 직접 제작하고 배포해요.</p></div><div class="guide-list">${GUIDE.map(g=>`<div class="guide-card"><span class="step">${g[0]}</span><div><h3>${esc(g[1])}</h3><p>${esc(g[2])}</p><div class="notice" style="margin-top:11px;font-size:12px">📸 캡처 필요한 곳: ${esc(g[3])}</div></div></div>`).join('')}</div>`}
function renderSubmit(){let w=db.teamData[member.team].work||{},isTeacherSample=member.team===10,file=db.teamData[10]?.fileName;return `<div class="section-head"><div class="eyebrow">STEP 06 · SHARE YOUR WORK</div><h2>${isTeacherSample?'교사 예시 작품 등록':'완성 작품 제출'}</h2><p class="muted">${isTeacherSample?'교사 예시는 작품 공유회 맨 앞에 고정돼요.':'작품을 제출하면 작품 공유회에 자동으로 모여요.'}</p></div><div class="card pad"><form id="work-form"><div class="grid2"><div class="field"><label>작품 이름 <span class="required">*</span></label><input class="input" name="title" required maxlength="80" placeholder="예: 방송실 장비 찾기" value="${esc(w.title||'')}"></div><div class="field"><label>작품 링크 (https://) ${isTeacherSample?'(선택)':'*'}</label><input class="input" name="url" ${isTeacherSample?'':'required'} type="url" placeholder="https://..." value="${esc(w.url||'')}"></div></div>${isTeacherSample?`<div class="field sample-upload-field"><label>또는 예시 HTML 파일 올리기</label><input class="input" id="teacher-example-file" type="file" accept=".html,.htm,text/html"><p class="helper" id="example-upload-state">${file?'등록된 파일: '+esc(file):'HTML 단일 파일을 선택하면 작품 공유회에서 예시를 미리 볼 수 있어요.'}</p></div>`:''}<div class="field"><label>프로그램 개요 <span class="required">*</span></label><textarea class="textarea" name="summary" required maxlength="600" placeholder="어떤 문제를 누구를 위해 해결하는 프로그램인가요? 2~4문장으로 설명해 주세요.">${esc(w.summary||'')}</textarea></div><div class="field"><label>실제로 구현된 핵심 기능 <span class="required">*</span></label><textarea class="textarea" name="features" required maxlength="700" placeholder="1. 사용자에게 보이는 기능
2. 실제 입력하면 동작하는 기능
3. 모바일에서 확인한 점">${esc(w.features||'')}</textarea></div><div class="field"><label>제작하면서 가장 많이 바뀐 점</label><textarea class="textarea" name="changes" maxlength="600" placeholder="처음 계획과 달라진 부분과 이유를 작성하세요.">${esc(w.changes||'')}</textarea></div><button type="submit" class="btn">${w.title?'제출 내용 수정 저장하기':isTeacherSample?'교사 예시 등록하기':'우리 모둠 작품 제출하기'} →</button></form></div><div style="margin-top:20px"><button class="btn outline" data-act="tab" data-tab="gallery">작품 공유회 보기</button></div>`}
function renderGallery(){let items=[{n:10,w:db.teamData[10].work||{title:'교사 예시 작품',summary:'교사가 준비하는 웹앱 예시입니다. 예시 작품 등록 후 체험할 수 있어요.'},sample:true},...Array.from({length:9},(_,i)=>({n:i+1,w:db.teamData[i+1].work})).filter(x=>x.w&&x.w.title)];let studentCount=items.length-1;return `<div class="section-head"><h2>제1회 호연고 해커톤 작품 공유회</h2><p class="muted">작품을 열어보고 <b>전체보기</b>에서 계획서·모둠원 의견·기획 과정을 함께 볼 수 있어요.</p></div><div class="row wrap" style="margin-bottom:22px"><span class="tag violet">학생 작품 ${studentCount} / 9모둠</span><span class="tag mint">교사 예시 맨 앞 고정</span></div><div class="gallery">${items.map((x,i)=>{let isSample=x.n===10,w=x.w,hasWork=!!db.teamData[x.n].work,hasFile=!!db.teamData[10].fileHtml,link=safeUrl(w.url);return `<article class="project-card ${isSample?'gallery-teacher-sample':''}"><div class="project-banner">${isSample?'👩‍🏫':['🎙️','🌡️','📊','🎬','♻️','🧬','📚','🌿','📰'][x.n-1]}${isSample?'<span class="sample-order">01 · 교사 예시</span>':''}</div><div class="project-card-body"><span class="tag ${isSample?'mint':'violet'}" style="align-self:flex-start">${isSample?'교사 예시 · 10모둠':x.n+'모둠'}</span><h3>${esc(w.title)}</h3><p>${esc(w.summary||'')}</p><div class="note">제작: ${esc(SEED[x.n].members)}</div><div class="card-footer">${hasWork?`<button class="btn small" data-act="detail" data-no="${x.n}">전체보기</button>`:`<span class="tag">등록 준비 중</span>`}${isSample&&hasFile?`<button class="btn small outline" data-act="sample-preview">예시 체험 ↗</button>`:link?`<a class="btn small outline" href="${esc(link)}" target="_blank" rel="noopener noreferrer">웹앱 실행 ↗</a>`:''}</div></div></article>`}).join('')}</div>`}
function renderReflect(){if(!refOpen)return `<div class="card pad lock" style="text-align:center"><div class="icon">🔐</div><div class="eyebrow">PERSONAL REFLECTION</div><h2 style="font-size:26px;margin-bottom:12px">나만의 소감·평가</h2><p class="muted" style="margin-bottom:23px">${esc(member.name)} 학생의 기록입니다. 모둠원은 볼 수 없고 교사만 내려받아 확인할 수 있어요. 다시 입장할 때마다 개인 PIN을 입력해 주세요.</p><form id="unlock-form"><div class="field"><input type="password" name="pin" class="input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" placeholder="나의 개인 PIN 6자리" aria-label="개인 PIN"></div><button class="btn block" type="submit">개인 기록 열기 →</button></form></div>`;
let r=db.reflections[member.id]||{answers:{},ratings:{},peers:{},status:'draft'};let peers=STUDENTS.filter(s=>s.team===member.team&&s.id!==member.id);return `<div class="page-header"><div><div class="eyebrow">PRIVATE · ${esc(member.name)}</div><h1>나의 해커톤 소감문</h1><p>개인 PIN으로 열었어요. 작성한 내용은 자동 저장돼요.</p></div><div class="row wrap"><span class="tag mint">🔒 교사만 열람</span><span class="tag">${r.status==='submitted'?'제출됨 · 다시 수정 가능':'임시 작성 중'}</span></div></div><form id="reflect-form"><section class="card pad" style="margin-bottom:17px"><h2 class="step-title">① 경험을 구체적으로 되돌아보기</h2><p class="subtext">“열심히 했다”보다 내가 실제로 했던 행동·결과·어려움을 적어 주세요.</p>${REFLECTIONS.map((q,i)=>`<div class="question-block"><label for="${q[0]}">${i+1}. ${esc(q[1])}</label><textarea id="${q[0]}" class="textarea" data-ref="${q[0]}" placeholder="구체적인 예시나 상황을 넣어 작성하세요.">${esc(r.answers?.[q[0]]||'')}</textarea></div>`).join('')}</section><section class="card pad" style="margin-bottom:17px"><h2 class="step-title">② 자기평가</h2><p class="subtext">1점(더 노력 필요)부터 5점(매우 적극적)까지 자신의 행동을 근거로 평가해요.</p>${SELF.map(x=>`<div class="self-rating"><div class="rating-row"><div><b>${esc(x[1])}</b><p class="note">${esc(x[2])}</p></div><select class="select" data-rating="${x[0]}">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(r.ratings?.[x[0]]||0)===v?'selected':''}>${v?v+'점':'선택하세요'}</option>`).join('')}</select></div></div>`).join('')}<div class="field" style="margin-top:19px"><label>자기평가 근거: 가장 적극적으로 참여한 순간과 개선할 점</label><textarea class="textarea" data-ref="self_evidence" placeholder="예: 필요한 기능을 제안하고 테스트를 맡았으나, 발표 준비는 더 적극적으로 참여할 필요가 있었다.">${esc(r.answers?.self_evidence||'')}</textarea></div></section><section class="card pad"><h2 class="step-title">③ 동료평가</h2><p class="subtext">모둠원 각자의 참여와 협력을 사실에 근거해 평가해요. 학생에게는 공개되지 않아요.</p>${peers.map(p=>{let pr=r.peers?.[p.id]||{};return `<div class="self-rating" style="margin-bottom:12px"><div class="row spread" style="margin-bottom:12px"><b>${esc(p.name)}</b><span class="tag violet">${member.team}모둠</span></div><div class="rating-row"><label for="score-${encodeURIComponent(p.id)}">활동 참여도</label><select class="select" id="score-${encodeURIComponent(p.id)}" data-peer="${esc(p.id)}" data-peerfield="participation">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(pr.participation||0)===v?'selected':''}>${v?v+'점':'선택하세요'}</option>`).join('')}</select></div><div class="rating-row"><label>협력과 의견 존중</label><select class="select" data-peer="${esc(p.id)}" data-peerfield="cooperation">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(pr.cooperation||0)===v?'selected':''}>${v?v+'점':'선택하세요'}</option>`).join('')}</select></div><div class="field"><label>그 친구가 실제로 기여한 내용과 개선하면 좋을 점</label><textarea class="textarea" data-peer="${esc(p.id)}" data-peerfield="evidence" placeholder="구체적인 행동을 중심으로 공정하게 작성하세요.">${esc(pr.evidence||'')}</textarea></div></div>`}).join('')}</section><div class="float-footer"><span class="note" id="reflect-save">작성한 내용은 자동으로 임시 저장돼요.</span><div class="row wrap"><button class="btn outline" type="button" data-act="lock-reflect">잠그고 나가기</button><button class="btn" type="submit">소감·평가 제출하기</button></div></div></form>`}

function csv(rows,filename){let cols=[...new Set(rows.flatMap(o=>Object.keys(o)))];let encode=x=>`"${String(x??'').replace(/"/g,'""')}"`;let data='\ufeff'+cols.map(encode).join(',')+'\r\n'+rows.map(o=>cols.map(c=>encode(o[c])).join(',')).join('\r\n');download(data,filename,'text/csv;charset=utf-8')}
function download(content,filename,type='text/plain;charset=utf-8'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}

document.addEventListener('click',async e=>{let el=e.target.closest('[data-act]');if(!el)return;let a=el.dataset.act;if(a==='scroll-login'||a==='go-login'){view='login';render();return}if(a==='open-gallery'){view='gallery';render();return}if(a==='go-home'){view='landing';render();return}if(a==='select-team'){let n=Number(el.dataset.no);if(!member||n!==member.team){notify('자신이 소속된 모둠을 선택해 주세요.');return}teamChoice=n;render();return}if(a==='goto-teacher'){member=null;teamEntered=false;refOpen=false;teacher=false;view='teachergate';render();return}if(a==='logout'){askLogout();return}if(a==='set-login'){loginMode=el.dataset.mode;view='login';render();return}if(a==='clear-team-pin'){let n=Number(el.dataset.no);if(n<1||n>10||!teacher)return;db.teamPins[n]=null;save();render();notify(n+'모둠 PIN 설정을 해제했어요. 다음 입장자가 새 PIN을 정할 수 있어요.');return}if(a==='sample-preview'){let html=db.teamData[10]?.fileHtml;if(!html)return notify('교사 예시 HTML 파일을 먼저 등록해 주세요.');document.body.insertAdjacentHTML('beforeend',`<div class="drawer-bg" id="detail-bg"><div class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><h2>교사 예시 웹앱 체험</h2><button class="drawer-close" data-act="close-detail" aria-label="닫기">×</button></div><iframe title="교사 예시 웹앱" sandbox="allow-scripts allow-forms" class="teacher-preview-frame" srcdoc="${esc(html)}"></iframe><p class="note">업로드한 HTML을 이 브라우저에서 미리 보여줘요.</p></div></div>`);return}if(a==='tab'){if(tab==='reflect')saveReflection();refOpen=false;tab=el.dataset.tab;render();return}if(a==='remove-note'){db.teamData[member.team].notes=db.teamData[member.team].notes.filter(x=>x.uid!==el.dataset.id||x.id!==member.id);save();render();return}if(a==='copy-prompt'){let text=buildPrompt(member.team);try{await navigator.clipboard.writeText(text)}catch{let t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}notify('프롬프트를 복사했어요. ChatGPT에 붙여넣어 주세요.');return}if(a==='download-prompt'){download(buildPrompt(member.team),`${member.team}모둠_웹앱_제작프롬프트.txt`);return}if(a==='detail'){let n=Number(el.dataset.no);if(!db.teamData[n].work)return;document.body.insertAdjacentHTML('beforeend',detailOverlay(n));return}if(a==='close-detail'){by('#detail-bg')?.remove();return}if(a==='ref-remove'){db.teamData[member.team].refs.splice(Number(el.dataset.index),1);save();render();return}if(a==='lock-reflect'){saveReflection();refOpen=false;render();return}if(a==='teacher-tab'){teacherTab=el.dataset.mode;render();return}if(a==='export'){exportActivity(el.dataset.type);return}});
document.addEventListener('click',e=>{if(e.target.id==='detail-bg')by('#detail-bg').remove()});document.addEventListener('keydown',e=>{if(e.key==='Escape')by('#detail-bg')?.remove()});
document.addEventListener('change',async e=>{if(e.target.id==='reg-student'){let f=by('#teacher-code-field');if(f){let isTeacher=e.target.value.startsWith('10:');f.hidden=!isTeacher;f.querySelector('input').required=isTeacher;}return}if(e.target.id==='teacher-example-file'){if(!member||member.team!==10||!teamEntered)return;let file=e.target.files[0];if(!file)return;if(!/\.html?$/i.test(file.name)){notify('HTML 파일만 등록할 수 있어요.');return}if(file.size>600*1024){notify('HTML 파일은 최대 600KB까지 등록할 수 있어요.');return}let t=await file.text();db.teamData[10].fileHtml=t;db.teamData[10].fileName=file.name;save();let st=by('#example-upload-state');if(st)st.textContent='등록된 파일: '+file.name;notify('교사 예시 HTML 파일을 등록했어요. 작품 정보를 저장해 주세요.');return}if(e.target.id!=='ref-file'||!member)return;let files=[...e.target.files];for(let file of files){if(db.teamData[member.team].refs.length>=3){notify('참고 이미지는 최대 3장까지 업로드할 수 있어요.');break}if(!file.type.startsWith('image/'))continue;try{let img=await new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});let max=950,scale=Math.min(1,max/Math.max(img.width,img.height)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(img.width*scale));can.height=Math.max(1,Math.round(img.height*scale));can.getContext('2d').drawImage(img,0,0,can.width,can.height);let data=can.toDataURL('image/jpeg',.72);if(data.length>1200000){notify('이미지가 너무 커서 저장하지 못했어요.');continue}db.teamData[member.team].refs.push({name:file.name.slice(0,45),data});}catch{notify('이미지를 읽지 못했어요.')}}save();render()});
